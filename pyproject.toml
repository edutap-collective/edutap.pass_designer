[project]
name = "edutap.pass_designer"
version = "0.1.0.dev0"
description = "Visual designer for Google Wallet passes"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "EUPL-1.2" }
dependencies = [
    "edutap.wallet-google==3.0.0b2",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "faker>=40.0",
    "uvicorn[standard]>=0.32",
    "anyio>=4.6",
]

[dependency-groups]
dev = [
    "pdbp>=1.6",
    "ruff>=0.16",
    { include-group = "test" },
    { include-group = "typecheck" },
]
test = [
    "pytest>=8.3",
    "anyio>=4.6",
    "httpx>=0.27",
]
typecheck = ["ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exercises a real dependency (e.g. Docker), not just this package's own code",
]
